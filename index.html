let drinkSelection = new Set();
let voteSaved = false;
let voteBusy = false;
let voteWriting = false;
let voteScreenPinned = false;
let voteListenerStarted = false;

const CONTESTS = [
  { icon: '🧻', title: 'Мумия', meta: '2-4 пары · 5 мин', steps: ['Разбейтесь на пары.', 'За 2 минуты обмотайте партнёра бумагой.', 'Побеждает самая плотная и быстрая мумия.'] },

];
/* ====================================== */

const $ = s => document.querySelector(s);
// ===== ГОТОВНОСТЬ FIREBASE =====
const waitForFB = () => new Promise((resolve, reject) => {
  if (window.FB) return resolve();
  if (window.FB_ERROR) return reject(window.FB_ERROR);
  const cleanup = () => {
    clearTimeout(timer);
    document.removeEventListener('fb-ready', ready);
    document.removeEventListener('fb-error', failed);
  };
  const ready = () => { cleanup(); resolve(); };
  const failed = () => { cleanup(); reject(window.FB_ERROR || new Error('Firebase недоступен')); };
  const timer = setTimeout(() => { cleanup(); reject(new Error('Не удалось загрузить Firebase. Проверь интернет и обнови страницу.')); }, 15000);
  document.addEventListener('fb-ready', ready, { once: true });
  document.addEventListener('fb-error', failed, { once: true });
});

// ===== ЛОКАЛЬНЫЕ ФЛАГИ =====
const memoryFlags = new Map();
const localFlags = {
  removeItem(key) { memoryFlags.delete(key); try { localStorage.removeItem(key); } catch {} },
  getItem(key) { if(memoryFlags.has(key)) return memoryFlags.get(key); try { return localStorage.getItem(key); } catch { return null; } },
  setItem(key, value) { memoryFlags.set(key, String(value)); try { localStorage.setItem(key, value); } catch { /* Приватный режим браузера. */ } }
};

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}


// ===== АНОНИМНЫЙ УЧАСТНИК И ТРИ ГОЛОСА =====
const VOTING_START = Date.parse('2026-10-31T18:00:00+03:00');
let sessionReady = false, ownCharacter = false, connected = false;
let serverOffset = 0, clockReady = false, ballotsReady = false, ballotBusy = false;
let characterData = {}, ballots = {};
function votingOpen() { return clockReady && Date.now() + serverOffset >= VOTING_START; }
function ownChoices() { return Object.values(ballots[window.FB?.uid] || {}).filter(Boolean); }
function nextBallot(current, id) {
  const selected = [current?.first, current?.second, current?.third].filter(Boolean);
  const index = selected.indexOf(id);
  if (index >= 0) selected.splice(index, 1);
  else if (selected.length < 3) selected.push(id);
  else return undefined;
  return { first: selected[0] || '', second: selected[1] || '', third: selected[2] || '' };
}
function updateVotingUI() {
  const status = $('#character-vote-status');
  const choices = ownChoices();
  status.textContent = !sessionReady ? 'Подключаемся…' : !connected ? 'Нет соединения. Голосование временно недоступно.' : !clockReady ? 'Проверяем время…' : !votingOpen() ? 'Голосование откроется 31 октября в 18:00 по Москве' : !ownCharacter ? 'Заполни карточку, чтобы получить три голоса' : !ballotsReady ? 'Загружаем голоса…' : `Осталось голосов: ${3 - choices.length} из 3. Голос можно снять и переставить.`;
  $('#addLateBtn').hidden = ownCharacter;
  $('#addLateBtn').disabled = !sessionReady || !connected;
  document.querySelectorAll('[data-character-vote]').forEach(button => {
    const selected = choices.includes(button.dataset.characterVote);
    button.disabled = !sessionReady || !connected || !votingOpen() || !ownCharacter || !ballotsReady || ballotBusy || (!selected && choices.length >= 3);
  });
}
function rebuildCharacters() {
  const counts = {};
  for (const ballot of Object.values(ballots)) for (const id of new Set(Object.values(ballot || {}).filter(Boolean))) counts[id] = (counts[id] || 0) + 1;
  window.__characters = Object.entries(characterData).map(([id,c]) => ({...c,id,likes:counts[id] || 0})).sort((a,b) => b.likes-a.likes || b.createdAt-a.createdAt);
  renderCarousel(window.__characters);
  if ($('#charDialog').open) openChar(window.currentCharacterId);
  updateVotingUI();
}
async function startSession() {
  try {
    await waitForFB();
    const fb = window.FB;
    fb.onValue(fb.ref(fb.db, '.info/connected'), snap => { connected = snap.val() === true; updateVotingUI(); });
    fb.onValue(fb.ref(fb.db, '.info/serverTimeOffset'), snap => { serverOffset = Number(snap.val()) || 0; clockReady = true; updateVotingUI(); });
    const [card, drinks] = await Promise.all([fb.get(fb.ref(fb.db,'characters/' + fb.uid)), fb.get(fb.ref(fb.db,'cocktailVotes/' + fb.uid))]);
    ownCharacter = !!card.val();
    localFlags.removeItem('char_submitted');
    if (ownCharacter) localFlags.setItem('char_submitted',fb.uid);
    if (drinks.val()) { localFlags.setItem('drinks_voted_' + fb.uid,'1'); showSavedDrinkVote(drinks.val()); }
    else localFlags.removeItem('drinks_voted_' + fb.uid);
    sessionReady = true;
    switchScreen();
    updateVotingUI();
  } catch(error) {
    $('#character-vote-status').textContent = 'Не удалось подключиться. Обнови страницу после проверки интернета.';
    $('#submitBtn').disabled = true;
    $('#addLateBtn').disabled = true;
    console.error(error);
    toast('Не удалось войти. Проверь интернет и настройки Firebase.');
  }
}

// ===== ТАЙМЕР =====
function tick() {
  const diff = PARTY_DATE - new Date();
  const el = $('#countdownWait');
  if (!el) return;
  if (diff <= 0) { el.textContent = '🎃 Время вечеринки!'; return; }
  const d = Math.floor(diff / 864e5);
  const h = Math.floor(diff % 864e5 / 36e5);
  const m = Math.floor(diff % 36e5 / 6e4);
  const s = Math.floor(diff % 6e4 / 1e3);
  el.innerHTML = `
    <span>${d}<small>дней</small></span>
    <span>${String(h).padStart(2,'0')}<small>часов</small></span>
    <span>${String(m).padStart(2,'0')}<small>минут</small></span>
    <span>${String(s).padStart(2,'0')}<small>секунд</small></span>`;
}

function switchScreen() {
  if (!sessionReady) return;
  if ($('#charFormDialog').open && !$('#screen-party').hidden) return;
  const now = Date.now() + serverOffset;
  const preview = new URLSearchParams(location.search).get('preview');
  const submitted = localFlags.getItem('char_submitted');
  const partyOpen = preview === 'party' || (preview !== 'wait' && now >= PARTY_DATE.getTime());

  const voted = submitted && localFlags.getItem('drinks_voted_' + submitted);
  if ((voteScreenPinned || (preview !== 'party' && preview !== 'wait' && !partyOpen && !voted)) && submitted) {
    $('#screen-wait').hidden = true;
    $('#screen-party').hidden = true;
    $('#charFormDialog').close();
    $('#screen-vote').hidden = false;
    initDrinkVote();
    return;
  }
  $('#screen-vote').hidden = true;

  if (partyOpen) {
    $('#screen-wait').hidden = true;
    $('#screen-party').hidden = false;
    if (!partyInited) $('#charFormDialog').close();
    initParty();
    return;
  }
  if (submitted || preview === 'wait') {
    $('#charFormDialog').close();
    $('#screen-wait').hidden = false;
    $('#screen-party').hidden = true;
    tick();
    return;
  }
  $('#screen-wait').hidden = true;
  $('#screen-party').hidden = true;
  const dlg = $('#charFormDialog');
  if (!dlg.open) dlg.showModal();
}

// ===== КАРТЫ ВЫБРАННЫХ КОКТЕЙЛЕЙ =====
function renderChosenDrinks() {
  const hand = $('#chosen-drinks');
  const selected = [...drinkSelection].map(id => DRINKS.find(drink => drink.id === id)).filter(Boolean);
  const key = selected.map(drink => drink.id).join(',');
  if (hand.dataset.selection === key) return;
  hand.dataset.selection = key;
  hand.innerHTML = selected.map((drink, index) => `<button type="button" class="chosen-drink" data-cocktail="${esc(drink.id)}" style="--card-index:${index};--angle:${(index - 1) * 13}deg;--offset:${(index - 1) * 82}px" aria-label="${esc(drink.name)}" aria-pressed="false"><span class="chosen-art" aria-hidden="true">${esc(drink.art)}</span><span class="chosen-name">${esc(drink.name)}</span><span class="chosen-caption">Твой выбор</span></button>`).join('');
}
$('#chosen-drinks').addEventListener('click', event => {
  const card = event.target.closest('.chosen-drink');
  if (!card) return;
  const drink = DRINKS.find(item => item.id === card.dataset.cocktail);
  if (!drink) return;
  $('#cocktail-detail').innerHTML = `<div class="cocktail-detail-art" aria-hidden="true">${esc(drink.art)}</div><h2 id="cocktail-detail-title">${esc(drink.name)}</h2><p class="cocktail-detail-label">Что внутри</p><ul>${drink.ingredients.split(' · ').map(item => `<li>${esc(item)}</li>`).join('')}</ul>`;
  $('#cocktailDialog').showModal();
});

$('#closeCocktailBtn').addEventListener('click', () => $('#cocktailDialog').close());
$('#cocktailDialog').addEventListener('click', event => { if (event.target === $('#cocktailDialog')) $('#cocktailDialog').close(); });

// ===== ГОЛОСОВАНИЕ ЗА КОКТЕЙЛЕЙ =====
function renderDrinkCards() {
  const carousel = $('#drink-carousel');
  const scroll = carousel.scrollLeft;
  carousel.innerHTML = DRINKS.map(drink => `<article class="drink-card ${drinkSelection.has(drink.id) ? 'selected' : ''}">
    <div class="drink-art" aria-hidden="true">${esc(drink.art)}</div>
    <span class="drink-type">${drink.count === 'безалкогольный' ? 'Без алкоголя' : 'С алкоголем'}</span>
    <h3>${esc(drink.name)}</h3><p>${drink.ingredients.split(' · ').map(esc).join('<br>')}</p>
    <button class="btn btn-ghost" data-drink="${esc(drink.id)}" aria-pressed="${drinkSelection.has(drink.id)}" ${voteSaved || voteBusy ? 'disabled' : ''}>${drinkSelection.has(drink.id) ? '✓ Выбрано' : '+ Хочу попробовать'}</button></article>`).join('');
  carousel.scrollLeft = scroll;
  $('#screen-vote').classList.toggle('has-voted', voteSaved);
  $('#vote-count').textContent = `Выбрано ${drinkSelection.size} из 3`;
  $('#vote-submit').disabled = drinkSelection.size !== 3 || voteSaved || voteBusy;
  $('#vote-submit').textContent = voteSaved ? '✓ Голоса учтены' : voteBusy ? 'Сохраняем…' : 'ОК · отправить 3 голоса';
}
function showSavedDrinkVote(vote) {
  voteSaved = true;
  drinkSelection = new Set([vote.first, vote.second, vote.third]);
  const id = localFlags.getItem('char_submitted');
  if (id) localFlags.setItem('drinks_voted_' + id, '1');
  $('#vote-status').textContent = '';
  $('#drink-results').hidden = false;
  renderChosenDrinks();
  renderDrinkCards();
}
async function initDrinkVote() {
  if (voteListenerStarted) return;
  voteListenerStarted = true;
  voteBusy = true;
  renderDrinkCards();
  $('#vote-status').textContent = 'Загружаем голоса…';
  try {
    await waitForFB();
    window.FB.onValue(window.FB.ref(window.FB.db, 'cocktailVotes'), snap => {
      const votes = Object.values(snap.val() || {});
      const own = (snap.val() || {})[localFlags.getItem('char_submitted')];
      if (!voteWriting) {
        voteBusy = false;
        if (own) showSavedDrinkVote(own);
        else { $('#vote-status').textContent = ''; renderDrinkCards(); }
      }
      const scores = DRINKS.map(drink => ({ ...drink, total: votes.filter(v => [v.first, v.second, v.third].includes(drink.id)).length })).sort((a,b) => b.total - a.total);
      const maximum = scores[0]?.total || 0;
      $('#drink-ranking').innerHTML = scores.map(drink => {
        const leader = maximum > 0 && drink.total === maximum;
        return `<div class="drink-chart-row ${leader ? 'is-leader' : ''}"><div class="drink-chart-label"><span>${esc(drink.name)}${leader ? ' <small>Лидер</small>' : ''}</span><b>${drink.total}</b></div><div class="drink-chart-track"><div class="drink-chart-fill" style="width:${maximum ? drink.total / maximum * 100 : 0}%">${drink.total ? '<span aria-hidden="true">🎃</span>' : ''}</div></div></div>`;
      }).join('');
    }, error => {
      voteBusy = true;
      renderDrinkCards();
      $('#vote-status').textContent = 'Не удалось загрузить голоса. Попробуй обновить страницу.';
      console.error(error);
    });
  } catch (error) {
    $('#vote-status').textContent = error.message;
    voteListenerStarted = false;
  }
}
$('#drink-carousel').addEventListener('click', event => {
  const button = event.target.closest('[data-drink]');
  if (!button || voteBusy || voteSaved) return;
  const id = button.dataset.drink;
  if (drinkSelection.has(id)) drinkSelection.delete(id);
  else if (drinkSelection.size < 3) drinkSelection.add(id);
  else { $('#vote-status').textContent = 'Уже выбраны три. Сними один вариант, чтобы выбрать другой.'; return; }
  $('#vote-status').textContent = '';
  renderDrinkCards();
});
$('#vote-prev').addEventListener('click', () => $('#drink-carousel').scrollBy({ left: -280, behavior: 'smooth' }));
$('#vote-next').addEventListener('click', () => $('#drink-carousel').scrollBy({ left: 280, behavior: 'smooth' }));
$('#vote-submit').addEventListener('click', async () => {
  if (!sessionReady || !connected) { toast('Нужно подключение к интернету'); return; }
  if (voteBusy || voteSaved || drinkSelection.size !== 3) return;
  const id = localFlags.getItem('char_submitted');
  if (!id) { $('#vote-status').textContent = 'Сначала заполни анкету гостя.'; return; }
  const [first, second, third] = [...drinkSelection];
  const vote = { first, second, third, createdAt: Date.now() };
  voteBusy = true;
  voteWriting = true;
  voteScreenPinned = true;
  renderDrinkCards();
  try {
    await waitForFB();
    const result = await window.FB.runTransaction(window.FB.ref(window.FB.db, 'cocktailVotes/' + id), current => current ? undefined : vote, { applyLocally: false });
    if (result.committed) showSavedDrinkVote(vote);
    else { const saved = await window.FB.get(window.FB.ref(window.FB.db,'cocktailVotes/' + id)); if (saved.val()) showSavedDrinkVote(saved.val()); }
  } catch (error) {
    $('#vote-status').textContent = 'Голоса не сохранены. Проверь соединение и попробуй ещё раз.';
    console.error(error);
  } finally { voteWriting = false; voteBusy = false; renderDrinkCards(); }
});
$('#vote-done').addEventListener('click', () => { voteScreenPinned = false; switchScreen(); });
$('#show-drink-votes').addEventListener('click', () => {
  if (!localFlags.getItem('char_submitted')) { toast('Для голосования сначала заполни анкету по обычной ссылке.'); return; }
  voteScreenPinned = true;
  $('#screen-wait').hidden = true;
  $('#screen-vote').hidden = false;
  initDrinkVote();
});

// ===== ОТПРАВКА АНКЕТЫ =====
$('#charForm').addEventListener('submit', async e => {
  e.preventDefault();

  if (!sessionReady || !connected) { toast('Нужно подключение к интернету'); return; }
  if (ownCharacter) { toast('Твоя карточка уже сохранена'); return; }
  const name = $('#name').value.trim();
  const persona = $('#persona').value.trim();
  if (!name || !persona) { toast('Имя и персонаж обязательны'); return; }

  if (!$('#charForm').reportValidity()) return;
  const btn = $('#submitBtn');
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = 'Отправляем...';

  try {
    await waitForFB();
    const fields = { name, persona, favorite: $('#favorite').value.trim(), mood: $('#mood').value.trim(), soundtrack: $('#soundtrack').value.trim() };
    const uid = window.FB.uid;
    const newRef = window.FB.ref(window.FB.db, 'characters/' + uid);
    const result = await window.FB.runTransaction(newRef, current => current ? undefined : { ...fields, createdAt: Date.now() + serverOffset }, { applyLocally: false });
    if (!result.committed) { ownCharacter = true; localFlags.setItem('char_submitted',uid); $('#charFormDialog').close(); updateVotingUI(); toast('Карточка уже создана в другой вкладке'); switchScreen(); return; }
    ownCharacter = true;
    localFlags.setItem('char_submitted', uid);
    updateVotingUI();
    e.target.reset();
    $('#charFormDialog').close();
    toast('Карточка сохранена 🦇');
    switchScreen();
  } catch (err) {
    console.error(err);
    toast('Ошибка: ' + (err.message || 'попробуй ещё раз'));
  } finally {
    btn.disabled = false; btn.textContent = '🎃 Отправить';
  }
});

// ===== ИНИЦИАЛИЗАЦИЯ =====
let partyInited = false;
function initParty() {
  if (partyInited) return;
  partyInited = true;

  listenCharacters();

  $('#closeFormBtn').hidden = false;
  $('#addLateBtn').addEventListener('click', () => { if (ownCharacter || !sessionReady || !connected) return; $('#charForm').reset(); $('#charFormDialog').showModal(); });
  $('#closeFormBtn').addEventListener('click', () => $('#charFormDialog').close());

}

// ===== ЦВЕТ И СОДЕРЖИМОЕ КАРТОЧКИ =====
function characterBody(c) {
  return `<div class="guest-details"><div class="guest-field"><small>Персонаж</small><strong>${esc(c.persona)}</strong></div><div class="guest-field"><small>Любимый ужастик</small><span>${esc(c.favorite || 'Не указан')}</span></div><div class="guest-field"><small>Саундтрек вечера</small><span>${esc(c.soundtrack || 'Не указан')}</span></div><div class="guest-mood"><small>Настрой на вечер</small><strong>${esc(c.mood || 'Не указан')}</strong></div></div>`;
}

// ===== КАРУСЕЛЬ + ЛАЙКИ =====
async function listenCharacters() {
  try {
    await waitForFB();
    const fb = window.FB;
    fb.onValue(fb.ref(fb.db,'characters'), snap => {
      characterData = snap.val() || {};
      ownCharacter = !!characterData[fb.uid];
      if (ownCharacter) localFlags.setItem('char_submitted',fb.uid);
      else localFlags.removeItem('char_submitted');
      rebuildCharacters();
    }, error => { $('#carousel').textContent = 'Не удалось загрузить карточки.'; console.error(error); });
    fb.onValue(fb.ref(fb.db,'characterVotes'), snap => {
      ballots = snap.val() || {}; ballotsReady = true; rebuildCharacters();
    }, error => { ballotsReady = false; updateVotingUI(); toast('Не удалось загрузить голоса'); console.error(error); });
  } catch(error) { $('#carousel').textContent = error.message; }
}

function renderCarousel(list) {
  const el = $('#carousel');
  const scrollLeft = el.scrollLeft;
  if (!list.length) {
    el.innerHTML = '<div class="empty">Пока никто не добавил карточку 👻</div>';
    return;
  }
  el.innerHTML = list.map(c => {
    const liked = ownChoices().includes(c.id);
    return `<div class="char-card guest-card" onclick="openChar('${esc(c.id)}')"><div class="guest-heading"><h3>${esc(c.name)}</h3><button data-character-vote="${esc(c.id)}" class="like-btn ${liked ? 'liked' : ''}" aria-label="${liked ? 'Снять голос' : 'Проголосовать'}" aria-pressed="${Boolean(liked)}" onclick="event.stopPropagation(); likeChar('${esc(c.id)}')">🎃 <span>${c.likes || 0}</span></button></div>${characterBody(c)}</div>`;
  }).join('');
  el.scrollLeft = scrollLeft;
  updateVotingUI();
}

// ===== ПОСТАВИТЬ ИЛИ СНЯТЬ ЛАЙК =====
window.likeChar = async function(id) {
  if (ballotBusy || !sessionReady || !connected || !ballotsReady) return;
  if (!votingOpen()) { toast('Голосование откроется 31 октября в 18:00'); return; }
  if (!ownCharacter) { toast('Сначала создай свою карточку'); return; }
  if (!characterData[id]) return;
  const wasLiked = ownChoices().includes(id);
  ballotBusy = true; updateVotingUI();
  try {
    const fb = window.FB;
    const result = await fb.runTransaction(fb.ref(fb.db,'characterVotes/' + fb.uid), current => nextBallot(current,id), { applyLocally: false });
    if (!result.committed) { toast('Все три голоса использованы. Сними один, чтобы выбрать другого.'); return; }
    toast(wasLiked ? 'Голос снят - можно выбрать другого 👻' : 'Голос учтён 🎃');
  } catch(error) { console.error(error); toast('Голос не сохранён. Проверь соединение и попробуй снова.'); }
  finally { ballotBusy = false; updateVotingUI(); }
};

// ===== FULLSCREEN CARD =====
window.openChar = function(id) {
  const c = (window.__characters || []).find(x => x.id === id);
  if (!c) return;
  window.currentCharacterId = id;
  const liked = ownChoices().includes(id);
  $('#charFullContent').innerHTML = `<div class="guest-heading"><h3>${esc(c.name)}</h3></div>${characterBody(c)}<div class="guest-actions"><button data-character-vote="${esc(c.id)}" class="btn ${liked ? '' : 'btn-ghost'}" aria-label="${liked ? 'Снять голос' : 'Проголосовать'}" aria-pressed="${Boolean(liked)}" onclick="likeChar('${esc(c.id)}')">🎃 ${c.likes || 0}</button></div>`;
  if (!$('#charDialog').open) $('#charDialog').showModal();
  updateVotingUI();
};

$('#charFormDialog').addEventListener('cancel', e => {
  if ($('#screen-party').hidden) e.preventDefault();
});

$('#closeCharBtn').addEventListener('click', () => $('#charDialog').close());
$('#charDialog').addEventListener('click', e => { if (e.target === $('#charDialog')) $('#charDialog').close(); });

// ===== ДИАГНОСТИКА ПОДКЛЮЧЕНИЯ =====
function showFirebaseError() {
  const banner = document.createElement('p');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:12px;background:#541b36;color:white;z-index:300;text-align:center;font-size:14px';
  banner.textContent = window.FB_ERROR?.message || 'Firebase не подключён.';
  document.body.appendChild(banner);
}
document.addEventListener('fb-error', showFirebaseError, { once: true });
if (window.FB_ERROR) showFirebaseError();

// ===== СТАРТ =====
startSession();
setInterval(updateVotingUI, 1000);
setInterval(tick, 1000);
setInterval(switchScreen, 30000);
</script>
</body>
</html>
